name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The latest Claude Code, for claude plugin validate and claude plugin test: mods use the newest
  # engine APIs (themes, backdrops), which older versions don't have.
  CLAUDE_BIN: npx --yes @anthropic-ai/claude-code@latest

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
