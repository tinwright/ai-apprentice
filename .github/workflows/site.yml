name: Rebuild site

# Starts tinwright.github.io's Site workflow after every change to main, so the catalog site shows
# it in minutes rather than at the next hourly run.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  dispatch:
    # Forks have neither the site nor the App's secrets.
    if: github.repository_owner == 'tinwright'
    runs-on: ubuntu-latest
    steps:
      # A short-lived token from the org's GitHub App, installed on tinwright.github.io with
      # Actions: read and write. github.token can't start workflows in another repository.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SITE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DISPATCH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tinwright.github.io
          permission-actions: write
      - run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY_OWNER/tinwright.github.io/actions/workflows/pages.yml/dispatches"
          -f ref=main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
